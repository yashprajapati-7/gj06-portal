<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111111">
<title>GJ06 — Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #111;
    --surface: #1C1C1C;
    --border: rgba(255,255,255,0.12);
    --white: #fff;
    --cream: #F5F0E8;
    --muted: rgba(255,255,255,0.4);
    --accent: #F5C518;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    background-image:
      linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 32px 32px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 48px 24px 64px;
  }

  /* ── Hero ── */
  .hero {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 48px;
    animation: fadeUp 0.7s cubic-bezier(.22,1,.36,1) both;
  }

  .logo-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 20px;
    animation: float 5s ease-in-out infinite;
  }

  .logo-wrap img {
    width: 160px;
    height: 160px;
    object-fit: contain;
    filter: invert(1);
  }

  .hero-text {
    text-align: center;
  }

  .brand {
    font-family: 'Playfair Display', serif;
    font-size: 28px;
    font-weight: 900;
    color: var(--white);
    letter-spacing: 2px;
    margin-bottom: 6px;
  }

  .tagline {
    font-size: 12px;
    font-weight: 500;
    color: var(--muted);
    letter-spacing: 2.5px;
    text-transform: uppercase;
  }

  /* ── Divider ── */
  .divider {
    width: 40px;
    height: 2px;
    background: var(--accent);
    border-radius: 2px;
    margin: 18px auto 0;
  }

  /* ── Grid ── */
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    width: 100%;
    max-width: 520px;
  }

  @media (max-width: 440px) {
    .grid { grid-template-columns: 1fr; }
    .brand { font-size: 26px; }
  }

  /* ── Card ── */
  .card {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 20px;
    padding: 22px 20px 18px;
    text-decoration: none;
    color: var(--white);
    display: flex;
    flex-direction: column;
    gap: 6px;
    position: relative;
    overflow: hidden;
    cursor: pointer;
    opacity: 0;
    animation: fadeUp 0.6s cubic-bezier(.22,1,.36,1) both;
    transition: border-color 0.2s, transform 0.2s cubic-bezier(.22,1,.36,1);
  }

  .card:nth-child(1) { animation-delay: 0.15s; }
  .card:nth-child(2) { animation-delay: 0.25s; }
  .card:nth-child(3) { animation-delay: 0.35s; }
  .card:nth-child(4) { animation-delay: 0.45s; }

  /* Shimmer fill on hover */
  .card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--white);
    transform: translateY(100%);
    transition: transform 0.28s cubic-bezier(.22,1,.36,1);
    z-index: 0;
    border-radius: 19px;
  }

  .card:hover {
    border-color: var(--white);
    transform: translateY(-3px);
    color: var(--bg);
  }

  .card:hover::before { transform: translateY(0); }
  .card:active { transform: translateY(0px) scale(0.98); }

  .card > * { position: relative; z-index: 1; }

  .card-tag {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--accent);
    transition: color 0.2s;
  }

  .card:hover .card-tag { color: #a08010; }

  .card-name {
    font-family: 'Playfair Display', serif;
    font-size: 21px;
    font-weight: 700;
    line-height: 1.1;
  }

  .card-desc {
    font-size: 12px;
    color: var(--muted);
    font-weight: 400;
    line-height: 1.55;
    transition: color 0.2s;
  }

  .card:hover .card-desc { color: rgba(0,0,0,0.55); }

  .card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 10px;
  }

  .card-icon {
    font-size: 20px;
    line-height: 1;
    filter: grayscale(0.3);
  }

  .card-arrow {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: 1.5px solid currentColor;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    opacity: 0.3;
    transition: opacity 0.2s, transform 0.2s;
  }

  .card:hover .card-arrow {
    opacity: 1;
    transform: rotate(-45deg);
  }

  /* ── Footer ── */
  .footer {
    margin-top: 44px;
    font-size: 11px;
    color: rgba(255,255,255,0.2);
    letter-spacing: 2px;
    text-transform: uppercase;
    text-align: center;
    animation: fadeUp 0.7s 0.55s cubic-bezier(.22,1,.36,1) both;
  }

  /* ── Animations ── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes float {
    0%, 100% { transform: translateY(0px); }
    50%       { transform: translateY(-7px); }
  }
</style>
</head>
<body>

<div class="hero">
  <div class="logo-wrap">
    <img src="logo.png" alt="GJ06">
  </div>
  <div class="hero-text">
    <div class="brand">GJ06</div>
    <div class="tagline">A magical 2D cafe &amp; bakehouse</div>
    <div class="divider"></div>
  </div>
</div>

<div class="grid">

  <a class="card" href="https://kushal2610.github.io/bakery-delivery/" target="_blank">
    <div class="card-tag">Bakery</div>
    <div class="card-name">Delivery</div>
    <div class="card-desc">Bakery delivery tracking & orders</div>
    <div class="card-footer">
      <div class="card-icon">🍞</div>
      <div class="card-arrow">↗</div>
    </div>
  </a>

  <a class="card" href="https://roster-psd0.onrender.com/" target="_blank">
    <div class="card-tag">Staff</div>
    <div class="card-name">Roster</div>
    <div class="card-desc">Weekly shift schedule & staff management</div>
    <div class="card-footer">
      <div class="card-icon">📋</div>
      <div class="card-arrow">↗</div>
    </div>
  </a>

  <a class="card" href="https://gj06-inventory-app-production.up.railway.app/login.php" target="_blank">
    <div class="card-tag">Operations</div>
    <div class="card-name">Inventory</div>
    <div class="card-desc">Stock tracking & inventory management</div>
    <div class="card-footer">
      <div class="card-icon">📊</div>
      <div class="card-arrow">↗</div>
    </div>
  </a>

  <a class="card" href="https://www.gj06.com.au/index.html" target="_blank">
    <div class="card-tag">Public</div>
    <div class="card-name">Website</div>
    <div class="card-desc">GJ06 public site, menu & cafe info</div>
    <div class="card-footer">
      <div class="card-icon">🖥️</div>
      <div class="card-arrow">↗</div>
    </div>
  </a>

</div>

<div class="footer">GJ06 Cafe &nbsp;·&nbsp; Internal Tools</div>

</body>
</html>
