<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#F8F7F4">
<title>GJ06 — Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #111;
    --white: #fff;
    --cream: #F8F7F4;
    --border: #111;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'DM Sans', sans-serif;
    background-color: var(--cream);
    background-image: radial-gradient(circle, #C8C5BF 1px, transparent 1px);
    background-size: 22px 22px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 24px 60px;
  }

  /* ── Hero ── */
  .hero {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 52px;
    animation: fadeUp 0.7s cubic-bezier(.22,1,.36,1) both;
  }

  .logo-wrap {
    width: 120px;
    height: 120px;
    border-radius: 28px;
    background: var(--white);
    border: 2px solid var(--black);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 22px;
    overflow: hidden;
    animation: float 4s ease-in-out infinite;
    box-shadow: 4px 4px 0 var(--black);
  }

  .logo-wrap img {
    width: 92px;
    height: 92px;
    object-fit: contain;
  }

  .brand {
    font-family: 'Playfair Display', serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: var(--black);
    margin-bottom: 6px;
  }

  .tagline {
    font-size: 12px;
    font-weight: 400;
    color: #888;
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }

  /* ── Grid ── */
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    width: 100%;
    max-width: 540px;
  }

  @media (max-width: 460px) {
    .grid { grid-template-columns: 1fr; }
  }

  /* ── Card ── */
  .card {
    background: var(--white);
    border: 2px solid var(--black);
    border-radius: 20px;
    padding: 26px 22px 22px;
    text-decoration: none;
    color: var(--black);
    display: flex;
    flex-direction: column;
    gap: 8px;
    position: relative;
    transition: transform 0.18s cubic-bezier(.22,1,.36,1), box-shadow 0.18s cubic-bezier(.22,1,.36,1), background 0.18s, color 0.18s;
    box-shadow: 4px 4px 0 var(--black);
    opacity: 0;
    animation: fadeUp 0.6s cubic-bezier(.22,1,.36,1) both;
    cursor: pointer;
    overflow: hidden;
  }

  .card:nth-child(1) { animation-delay: 0.15s; }
  .card:nth-child(2) { animation-delay: 0.25s; }
  .card:nth-child(3) { animation-delay: 0.35s; }
  .card:nth-child(4) { animation-delay: 0.45s; }

  .card::after {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--black);
    transform: scaleY(0);
    transform-origin: bottom;
    transition: transform 0.25s cubic-bezier(.22,1,.36,1);
    z-index: 0;
    border-radius: 18px;
  }

  .card:hover {
    transform: translate(-2px, -2px);
    box-shadow: 6px 6px 0 var(--black);
    color: var(--white);
  }

  .card:hover::after { transform: scaleY(1); }
  .card:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--black); }

  .card > * { position: relative; z-index: 1; }

  .card-tag {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #999;
    transition: color 0.18s;
  }

  .card:hover .card-tag { color: rgba(255,255,255,0.5); }

  .card-name {
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    font-weight: 700;
    line-height: 1.1;
  }

  .card-desc {
    font-size: 12px;
    color: #777;
    font-weight: 400;
    line-height: 1.55;
    transition: color 0.18s;
  }

  .card:hover .card-desc { color: rgba(255,255,255,0.65); }

  .card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 8px;
  }

  .card-icon {
    font-size: 22px;
    line-height: 1;
  }

  .card-arrow {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: 1.5px solid currentColor;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    opacity: 0.35;
    transition: opacity 0.18s, transform 0.18s;
  }

  .card:hover .card-arrow {
    opacity: 1;
    transform: rotate(-45deg);
  }

  /* ── Footer ── */
  .footer {
    margin-top: 48px;
    font-size: 11px;
    color: #aaa;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    text-align: center;
    animation: fadeUp 0.7s 0.6s cubic-bezier(.22,1,.36,1) both;
  }

  .footer span {
    color: #ccc;
    margin: 0 6px;
  }

  /* ── Animations ── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes float {
    0%, 100% { transform: translateY(0px); }
    50%       { transform: translateY(-6px); }
  }
</style>
</head>
<body>

<div class="hero">
  <div class="logo-wrap">
    <img src="logo.png" alt="GJ06 Logo">
  </div>
  <div class="brand">GJ 06 Cafe</div>
  <div class="tagline">A magical 2D cafe &amp; bakehouse</div>
</div>

<div class="grid">

  <a class="card" href="https://roster-psd0.onrender.com/" target="_blank">
    <div class="card-tag">Staff</div>
    <div class="card-name">Roster</div>
    <div class="card-desc">Weekly shift schedule & staff management</div>
    <div class="card-footer">
      <div class="card-icon">🗓</div>
      <div class="card-arrow">↗</div>
    </div>
  </a>

  <a class="card" href="https://www.gj06.com.au/index.html" target="_blank">
    <div class="card-tag">Public</div>
    <div class="card-name">Website</div>
    <div class="card-desc">GJ06 public site, menu & cafe info</div>
    <div class="card-footer">
      <div class="card-icon">🌐</div>
      <div class="card-arrow">↗</div>
    </div>
  </a>

  <a class="card" href="https://gj06-inventory-app-production.up.railway.app/login.php" target="_blank">
    <div class="card-tag">Operations</div>
    <div class="card-name">Inventory</div>
    <div class="card-desc">Stock tracking & inventory management</div>
    <div class="card-footer">
      <div class="card-icon">📦</div>
      <div class="card-arrow">↗</div>
    </div>
  </a>

  <a class="card" href="https://github.com/kushal2610/bakery-delivery" target="_blank">
    <div class="card-tag">Bakery</div>
    <div class="card-name">Delivery</div>
    <div class="card-desc">Bakery delivery tracking & orders</div>
    <div class="card-footer">
      <div class="card-icon">🥐</div>
      <div class="card-arrow">↗</div>
    </div>
  </a>

</div>

<div class="footer">
  GJ06 <span>·</span> Internal Tools <span>·</span> 2025
</div>

</body>
</html>
